<body>
    <p id="result"></p>
<script>
 function findmax(){
    var i;
    var max = 0;
    for (i=0; i <arguments.length; i++) {
        if (arguments[i]>max ){
        max = arguments[i];
        }
    }
    return max;
        }
    document.getElementById("result").innerHTML =findmax(
        400,500,600,1000000,20000000,89,0,6,4,24,6,8,9,00,7,5,4,2,3,4,5,6,7,8,8,50000000000) 
</script>
